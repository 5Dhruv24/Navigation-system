<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusNav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-panel:  #101d2c;
    --line:      #24384c;
    --cyan:      #6ec6ff;
    --cyan-dim:  #5c7a92;
    --text:      #eaf2fa;
    --text-dim:  #8ca3b6;
    --accent:    #ff7a45;
    --ok:        #4fd1a5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Space Grotesk', system-ui, sans-serif; background: #0b1622; }

  /* ---------- Map area: the real campus location map as background ---------- */
  #mapwrap {
    position: absolute; inset: 0;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #060d16;
  }

  #mapstage {
    position: relative;
    width: 1477px;   /* natural size of campus_map.jpg, scaled by transform below */
    height: 897px;
    flex-shrink: 0;
  }

  .offframe-strip {
    position: absolute;
    top: 0; right: 0;
    width: 300px; height: 100%;
    border-left: 1px dashed #3e6690;
  }
  .offframe-note {
    position: absolute;
    top: 10px; right: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #5c7a92;
    max-width: 280px;
    text-align: right;
    line-height: 1.5;
  }

  #mapstage img {
    width: 100%; height: 100%;
    display: block;
    /* the official map is a bright drafting sheet; darken slightly + boost
       contrast so our overlay markers/route stay legible on top of it */
    filter: brightness(0.55) saturate(1.15) contrast(1.05);
  }

  #overlay { position: absolute; inset: 0; }

  .node-label {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #cfe3f2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    transform: translate(10px, -6px);
    white-space: nowrap;
    pointer-events: none;
  }

  /* ---------- Floating search panel (Google Maps style) ---------- */
  .panel {
    position: absolute;
    top: 16px; left: 16px;
    width: 320px;
    max-width: calc(100% - 32px);
    background: rgba(16, 29, 44, 0.96);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    padding: 18px;
    color: var(--text);
    z-index: 1000;
  }

  .panel h1 { font-size: 17px; font-weight: 700; }
  .panel .sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; margin-bottom: 14px; }

  .field-label {
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--cyan-dim);
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    margin-top: 12px;
  }
  .field-label:first-of-type { margin-top: 0; }

  select {
    width: 100%;
    padding: 10px 11px;
    background: #0a1520;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13.5px;
    border-radius: 8px;
  }
  select:focus { outline: none; border-color: var(--cyan); }

  .btn-row { display: flex; gap: 8px; margin-top: 14px; }

  button {
    padding: 10px;
    background: var(--accent);
    border: none;
    color: #1a0e06;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border-radius: 8px;
    flex: 1;
  }
  button:hover { background: #ff8d5f; }
  button:disabled { background: var(--line); color: var(--text-dim); cursor: not-allowed; }

  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    flex: none;
    width: 42px;
    font-size: 16px;
  }
  button.ghost:hover { border-color: var(--cyan); color: var(--cyan); background: transparent; }

  .error {
    margin-top: 12px;
    padding: 9px 11px;
    border: 1px solid #7a2e2e;
    background: #2a1414;
    color: #ff9d9d;
    font-size: 12px;
    border-radius: 8px;
    display: none;
  }

  .result {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    display: none;
  }
  .result .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--cyan-dim);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .route-step {
    font-size: 13px;
    padding: 2.5px 0;
    display: flex;
    gap: 7px;
    align-items: baseline;
  }
  .route-step .idx {
    font-family: 'JetBrains Mono', monospace;
    color: var(--cyan-dim);
    font-size: 10.5px;
    width: 14px;
  }
  .total {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--ok);
    font-weight: 600;
  }
  .total span { color: var(--text-dim); font-size: 10.5px; font-weight: 400; }

  .status {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
  }

  /* ---------- Zoom controls ---------- */
  .zoom-ctrl {
    position: absolute; bottom: 26px; left: 16px;
    display: flex; flex-direction: column;
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    z-index: 1000;
  }
  .zoom-ctrl div {
    width: 36px; height: 36px; background: #101d2c;
    border-bottom: 1px solid var(--line);
    color: var(--text-dim); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .zoom-ctrl div:hover { color: var(--cyan); }

  .locate-btn {
    position: absolute;
    bottom: 26px; right: 16px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #101d2c;
    border: 1px solid var(--line);
    color: var(--cyan);
    font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 1000;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .locate-btn:hover { border-color: var(--cyan); }
</style>
</head>
<body>

<div id="mapwrap">
  <div id="mapstage">
    <img src="assets/campus_map.jpg" alt="USAR GGSIPU East Delhi Campus — satellite view">
    <div class="offframe-strip"></div>
    <div class="offframe-note">Block E / Gate 02 / East End Club<br>lie further east — shown here<br>at approximate relative position</div>
    <svg id="overlay" width="100%" height="100%" viewBox="0 0 1477 897" preserveAspectRatio="none"></svg>
  </div>
</div>

<div class="panel">
  <h1>🧭 CampusNav</h1>
  <div class="sub">USAR — GGSIPU East Delhi Campus</div>

  <div class="field-label">START LOCATION</div>
  <select id="start"><option value="">Loading…</option></select>

  <div class="field-label">DESTINATION</div>
  <select id="end"><option value="">Loading…</option></select>

  <div class="btn-row">
    <button id="findRouteBtn" onclick="findRoute()">Find Route</button>
    <button class="ghost" title="Use my current location as start" onclick="useMyLocation()">⦿</button>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="result" id="resultBox">
    <div class="label">ROUTE</div>
    <div id="routeSteps"></div>
    <div class="total" id="totalDistance"></div>
  </div>

  <div class="status" id="statusMsg"></div>
</div>

<div class="zoom-ctrl">
  <div onclick="zoom(1.15)">+</div>
  <div onclick="zoom(0.87)">−</div>
</div>
<div class="locate-btn" title="Use my location" onclick="useMyLocation()">⦿</div>

<script>
  // Relative path now that Flask serves this page itself — works
  // the same whether you're on 127.0.0.1:5000 or localhost:5000.
  const API_BASE = "";

  // ---------------------------------------------------------------
  // Node positions in IMAGE-PIXEL coordinates on campus_map.jpg
  // (1600 x 1200, the resized official location map). Estimated by
  // eye against the block layout — nudge these if you want pixel
  // -perfect placement for your actual printout/photo.
  // ---------------------------------------------------------------
  // Pixel coordinates on the real satellite screenshot
  // (campus_map.jpg, 1477 x 897 — last 300px is a dark padding strip
  // for the 3 locations that fall just outside the screenshot frame).
  const NODE_PIXELS = {
    Gate01:         { x: 630, y: 160 },
    BlockA:         { x: 615, y: 300 },  // matches the red pin (USAR)
    BlockC:         { x: 560, y: 330 },
    BlockB:         { x: 495, y: 355 },
    BlockD:         { x: 560, y: 400 },
    BlockG:         { x: 195, y: 460 },
    BoysHostel:     { x: 230, y: 560 },
    TeachersHostel: { x: 190, y: 650 },
    GirlsHostel:    { x: 320, y: 700 },
    Housing:        { x: 230, y: 780 },
    // Off-frame (approximate, east of this screenshot's edge):
    BlockE:         { x: 1300, y: 330 },
    Gate02:         { x: 1400, y: 280 },
    EastEndClub:    { x: 1350, y: 430 },
  };

  const EDGES = [
    ["Gate01", "BlockB"], ["Gate01", "BlockG"], ["Gate02", "BlockE"],
    ["BlockB", "BlockC"], ["BlockB", "BlockG"], ["BlockC", "BlockA"],
    ["BlockC", "BlockD"], ["BlockA", "BlockE"], ["BlockD", "BoysHostel"],
    ["BlockE", "EastEndClub"], ["BoysHostel", "TeachersHostel"],
    ["TeachersHostel", "GirlsHostel"], ["GirlsHostel", "Housing"],
  ];

  const svgNS = "http://www.w3.org/2000/svg";
  const overlay = document.getElementById("overlay");
  const mapstage = document.getElementById("mapstage");
  const nodeCircles = {};
  let routePolyline = null;
  let userDot = null;

  function svgEl(tag, attrs) {
    const el = document.createElementNS(svgNS, tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    return el;
  }

  // Draw dim campus edges
  EDGES.forEach(([a, b]) => {
    const p1 = NODE_PIXELS[a], p2 = NODE_PIXELS[b];
    overlay.appendChild(svgEl("line", {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      stroke: "#3e6690", "stroke-width": 4, opacity: 0.65,
    }));
  });

  // Draw nodes + labels
  Object.entries(NODE_PIXELS).forEach(([code, pos]) => {
    const circle = svgEl("circle", {
      cx: pos.x, cy: pos.y, r: 10,
      fill: "#6ec6ff", stroke: "#fff", "stroke-width": 2.5,
    });
    overlay.appendChild(circle);
    nodeCircles[code] = circle;

    const label = document.createElement("div");
    label.className = "node-label";
    label.textContent = code;
    label.style.left = (pos.x / 1477 * 100) + "%";
    label.style.top = (pos.y / 897 * 100) + "%";
    mapstage.appendChild(label);
  });

  // ---------------------------------------------------------------
  // Backend integration
  // ---------------------------------------------------------------
  const startSelect = document.getElementById("start");
  const endSelect = document.getElementById("end");
  const errorBox = document.getElementById("errorBox");
  const resultBox = document.getElementById("resultBox");
  const routeSteps = document.getElementById("routeSteps");
  const totalDistance = document.getElementById("totalDistance");
  const statusMsg = document.getElementById("statusMsg");
  const findRouteBtn = document.getElementById("findRouteBtn");
  let LOCATION_NAMES = {};

  async function loadLocations() {
    try {
      const res = await fetch(`${API_BASE}/locations`);
      if (!res.ok) throw new Error();
      const locations = await res.json();
      locations.forEach(loc => LOCATION_NAMES[loc.code] = loc.name);

      const optionsHTML = '<option value="">Select…</option>' +
        locations.map(loc => `<option value="${loc.code}">${loc.name}</option>`).join("");

      startSelect.innerHTML = optionsHTML;
      endSelect.innerHTML = optionsHTML;
    } catch (err) {
      statusMsg.textContent = "Backend unreachable — start app.py and reload.";
    }
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
    resultBox.style.display = "none";
  }
  function clearError() { errorBox.style.display = "none"; }

  function resetNodeStyles() {
    Object.values(nodeCircles).forEach(c => {
      c.setAttribute("fill", "#6ec6ff");
      c.setAttribute("r", 10);
    });
  }

  async function findRoute() {
    clearError();
    resultBox.style.display = "none";

    const start = startSelect.value;
    const end = endSelect.value;

    if (!start || !end) { showError("Select both a start location and a destination."); return; }
    if (start === end) { showError("Start and destination cannot be the same location."); return; }

    findRouteBtn.disabled = true;
    findRouteBtn.textContent = "Computing…";

    try {
      const res = await fetch(`${API_BASE}/shortest-path?start=${start}&end=${end}`);
      const data = await res.json();

      if (!res.ok) { showError(data.error || "Something went wrong."); return; }

      routeSteps.innerHTML = data.path.map((loc, i) =>
        `<div class="route-step"><span class="idx">${String(i + 1).padStart(2, "0")}</span>${loc.name}</div>`
      ).join("");
      totalDistance.innerHTML = `${data.total_distance_m} m <span>total distance</span>`;
      resultBox.style.display = "block";

      // Draw the route on top of the real campus map
      if (routePolyline) overlay.removeChild(routePolyline);
      resetNodeStyles();

      const points = data.path.map(loc => `${NODE_PIXELS[loc.code].x},${NODE_PIXELS[loc.code].y}`).join(" ");
      routePolyline = svgEl("polyline", {
        points, fill: "none", stroke: "#4fd1a5", "stroke-width": 7,
        "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.95,
      });
      overlay.appendChild(routePolyline);

      data.path.forEach(loc => {
        nodeCircles[loc.code].setAttribute("fill", "#4fd1a5");
        nodeCircles[loc.code].setAttribute("r", 13);
      });

    } catch (err) {
      showError("Could not reach the server. Make sure app.py is running.");
    } finally {
      findRouteBtn.disabled = false;
      findRouteBtn.textContent = "Find Route";
    }
  }

  // ---------------------------------------------------------------
  // Zoom (simple CSS transform scale on the map stage)
  // ---------------------------------------------------------------
  let currentScale = 1;
  function zoom(factor) {
    currentScale = Math.min(3, Math.max(0.5, currentScale * factor));
    mapstage.style.transform = `scale(${currentScale})`;
  }

  // ---------------------------------------------------------------
  // Device geolocation — snaps to nearest campus node.
  // Note: the map here is a non-georeferenced drafting drawing (not
  // real-world tiles), so we can't plot a precise "you are here" dot
  // on it — instead we report the nearest known campus location.
  // ---------------------------------------------------------------
  function useMyLocation() {
    if (!navigator.geolocation) {
      showError("Geolocation isn't supported in this browser.");
      return;
    }
    statusMsg.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        // Without real GPS-to-pixel calibration for this drafting
        // map, we default to Gate 01 as the practical starting point
        // and let the user confirm/change it.
        startSelect.value = "Gate01";
        statusMsg.textContent = "Location detected — defaulted start to Gate 01. Adjust if needed.";
      },
      () => { showError("Couldn't get your location. Check browser permissions."); }
    );
  }

  loadLocations();
</script>

</body>
</html>
